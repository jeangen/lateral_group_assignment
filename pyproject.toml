[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-pipeline"
version = "0.1.0"
description = "Configuration-driven pipeline for World Bank country indicators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "dbt-duckdb>=1.9,<2",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
wb-pipeline = "wb_pipeline.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
